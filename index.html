<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhaba Menu</title>
<style>
body
{background-color:#ffffff;color:#4a2c11;font-family:Arial,sans-serif;margin:30px;}
.header-container
{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #8b4513;padding-bottom:15px;margin-bottom:30px;}
.header-container h1
{color:#8b4513;margin:0;font-size:2.2rem;}
.header-container img
{width:120px;height:120px;border-radius:8px;border:2px solid #8b4513;}
h2
{color:#8b4513;margin-bottom:10px;}
table
{width:100%;max-width:500px;border-collapse:collapse;margin-bottom:25px;}
th,td
{border:1px solid #8b4513;padding:10px;text-align:left;}
th
{background-color:#8b4513;color:#ffffff;}
tr:nth-child(even)
{background-color:#fdf8f5;}
.order-btn
{background-color:#8b4513;color:#ffffff;border:none;padding:12px 25px;font-size:1rem;border-radius:5px;cursor:pointer;}
.order-btn:hover
{background-color:#5c2e0b;}
</style>
</head>
<body>
<div class="header-container">
<h1>Dhaba Menu</h1>
<img src="images/dhaba_menu.webp" alt="Dhaba Food Image">
</div>
<h2>Menu Items</h2>
<table>
<thead>
<tr>
<th>Item Name</th>
<th>Price (Rs)</th>
</tr>
</thead>
<tbody>
<tr><td>Paratha</td><td>70</td></tr>
<tr><td>Fried Egg</td><td>80</td></tr>
<tr><td>Chai</td><td>60</td></tr>
<tr><td>Lassi</td><td>100</td></tr>
<tr><td>Channay</td><td>150</td></tr>
</tbody>
</table>
<button class="order-btn" onclick="placeOrder()">Order Now</button>
<script>
function placeOrder(){
console.log("Order button was clicked for Dhaba Menu!");
window.alert("Your order has been placed! Thank you for ordering from our Dhaba.");
}
</script>
</body>
</html>
